spring.application.name=campusconnect-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/campusconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:campus_user}
spring.datasource.password=${DB_PASSWORD:campus_dev_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
